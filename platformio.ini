; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = wt32-s3-wrover-n16r2

[env:wt32-s3-wrover-n16r2]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM5
monitor_speed = 115200
monitor_port = COM5
monitor_dtr = 0
monitor_rts = 0
build_unflags = -std=gnu++11
build_flags = 
	-I src
	-std=gnu++17
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D BOARD_HAS_PSRAM
	-D LV_CONF_PATH=\"FilamentStationLvConf.h\"
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
lib_deps = 
	bblanchon/ArduinoJson@7.4.3
	lovyan03/LovyanGFX@1.2.25
	lvgl/lvgl@9.5.0
	tzapu/WiFiManager@2.0.17
test_build_src = true
test_filter = test_json_storage
test_speed = 115200

[env:native-scale-tests]
platform = native
platform_packages = platformio/toolchain-gccmingw32
extra_scripts = pre:scripts/native_test_env.py
build_flags =
	-I src
	-std=gnu++17
	-static
	-static-libgcc
	-static-libstdc++
test_build_src = true
build_src_filter =
	+<services/ScaleFilter.cpp>
	+<services/ScaleMath.cpp>
test_filter = test_scale_filter

[env:native-nfc-tests]
platform = native
platform_packages = platformio/toolchain-gccmingw32
extra_scripts = pre:scripts/native_test_env.py
build_flags =
	-I src
	-std=gnu++17
	-static
	-static-libgcc
	-static-libstdc++
test_build_src = true
build_src_filter =
	+<services/NfcPayload.cpp>
	+<services/Ntag21x.cpp>
	+<nfc/TagParsers.cpp>
	+<nfc/TagParserRegistry.cpp>
	+<nfc/OpenPrintTag.cpp>
	+<nfc/OpenTag3D.cpp>
test_filter = test_tag_payload
